[package]
name = "pyrudder-cli"
description = "Command-line interface for PyRudder"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "pyrudder"
path = "src/main.rs"

[dependencies]
pyrudder-core = { path = "../pyrudder-core", features = ["config-toml"] }
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
serde_json = "1.0"
toml = "0.8.23"

[target.'cfg(windows)'.dependencies]
pyrudder-platform-windows = { path = "../pyrudder-platform-windows" }
winreg = "0.55"
pyrudder-provider-pythonorg = { path = "../pyrudder-provider-pythonorg" }
tempfile = "3.23"
serde = { version = "1.0", features = ["derive"] }
console = "0.16"
dialoguer = { version = "0.12", default-features = false }
indicatif = "0.18"

[lints]
workspace = true
